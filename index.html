<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>10. Flappy Base</title><style>body{background:#0b0e14;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#121824;border:2px solid #0052FF;}</style></head>
<body>
<h1>10. Base Flappy Builder</h1>
<canvas id="c" width="300" height="250"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let y=100, dy=0, score=0;
document.onkeydown = () => dy = -5;
function loop() {
    ctx.clearRect(0,0,300,250);
    dy += 0.3; y += dy; if(y>250||y<0) y=100;
    ctx.fillStyle='#0052FF'; ctx.fillRect(50, y, 20, 20);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
